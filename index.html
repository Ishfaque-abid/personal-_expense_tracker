<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Expense Tracker</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

    <div class="max-w-6xl mx-auto p-6">

        <header class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800">
                Expense Tracker
            </h1>

            <span class="text-gray-500">My Finance Dashboard</span>
        </header>

        <section class="grid grid-cols-1 md:grid-cols-3 gap-5 mb-8">

            <div class="bg-white p-6 rounded-xl shadow">
                <p class="text-gray-500">Total Balance</p>
                <h2 id="balance" class="text-2xl font-bold mt-2">
                    ৳0
                </h2>
            </div>

            <div class="bg-white p-6 rounded-xl shadow">
                <p class="text-gray-500">Total Income</p>
                <h2 id="income" class="text-2xl font-bold text-green-600 mt-2">
                    ৳0
                </h2>
            </div>

            <div class="bg-white p-6 rounded-xl shadow">
                <p class="text-gray-500">Total Expense</p>
                <h2 id="expense" class="text-2xl font-bold text-red-500 mt-2">
                    ৳0
                </h2>
            </div>

        </section>

        <section class="bg-white p-6 rounded-xl shadow mb-8">

            <h2 class="text-xl font-bold mb-5">
                Add New Transaction
            </h2>

            <form id="transactionForm"
                  class="grid grid-cols-1 md:grid-cols-2 gap-4">

                <input
                    type="text"
                    id="title"
                    placeholder="Transaction title"
                    class="border p-3 rounded-lg outline-indigo-500"
                    required
                >

                <input
                    type="number"
                    id="amount"
                    placeholder="Amount"
                    min="0.01"
                    step="0.01"
                    class="border p-3 rounded-lg outline-indigo-500"
                    required
                >

                <select
                    id="type"
                    class="border p-3 rounded-lg"
                    required
                >
                    <option value="income">Income</option>
                    <option value="expense">Expense</option>
                </select>

                <input
                    type="date"
                    id="date"
                    class="border p-3 rounded-lg"
                    required
                >

                <button
                    type="submit"
                    class="bg-indigo-600 text-white p-3 rounded-lg hover:bg-indigo-700 md:col-span-2"
                >
                    Add Transaction
                </button>

            </form>

        </section>

        <section class="bg-white p-6 rounded-xl shadow">

            <h2 class="text-xl font-bold mb-5">
                Recent Transactions
            </h2>

            <div class="overflow-x-auto">
                <table class="w-full text-left">

                    <thead>
                        <tr class="border-b text-gray-500">
                            <th class="p-3">Title</th>
                            <th class="p-3">Date</th>
                            <th class="p-3">Type</th>
                            <th class="p-3">Amount</th>
                            <th class="p-3">Action</th>
                        </tr>
                    </thead>

                    <tbody id="transactionList">
                    </tbody>

                </table>
            </div>

        </section>

    </div>

    <script src="script.js"></script>

</body>
</html>
